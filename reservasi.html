<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi & Pembayaran - SM Sport Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <!-- MIDTRANS SNAP JS (SANDBOX) -->
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-kfLZOhGQ2bOx8YZ9"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="bg-emerald-500 text-slate-900 font-extrabold text-2xl px-3 py-1 rounded-lg">SM</div>
                <div>
                    <h1 class="text-xl font-bold text-white">SM SPORT CENTER</h1>
                    <p class="text-xs text-slate-400">Portal Pemesanan & Midtrans Payment</p>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xs text-slate-300 hover:text-white bg-slate-700 px-3 py-2 rounded-lg"><i class="fas fa-home mr-1"></i> Beranda</a>
                <div id="admin-link"></div>
                <div id="logout-link"></div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <div id="alert-area"></div>

        <!-- FORM LOGIN & REGISTER TABBED (guest only) -->
        <div id="guest-area" class="hidden">
            <div class="max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
                <div class="flex border-b border-slate-700 bg-slate-900/50">
                    <button onclick="switchTab('login')" id="btn-login" class="w-1/2 py-3.5 text-center text-sm font-bold border-b-2">Masuk</button>
                    <button onclick="switchTab('register')" id="btn-register" class="w-1/2 py-3.5 text-center text-sm font-bold border-b-2">Daftar</button>
                </div>

                <div class="p-6">
                    <div id="form-login" class="space-y-4">
                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
                                <input type="email" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                                <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                            </div>
                            <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg text-sm">Masuk Sekarang</button>
                        </form>
                    </div>

                    <div id="form-register" class="space-y-4 hidden">
                        <form id="register-form" class="space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap</label>
                                <input type="text" name="nama" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
                                <input type="email" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                                <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Konfirmasi Password</label>
                                <input type="password" name="konfirmasi_password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                            </div>
                            <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg text-sm">Daftar Akun</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- FORM SEWA + RIWAYAT (logged in only) -->
        <div id="member-area" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- FORM SEWA -->
            <div class="lg:col-span-1 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
                <h2 class="text-lg font-bold text-white"><i class="fas fa-calendar-plus text-emerald-400 mr-2"></i> Form Sewa Lapangan</h2>

                <form id="booking-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Pilih Lapangan</label>
                        <select name="lapangan_id" id="b-lapangan" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white"></select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Tanggal Sewa</label>
                        <input type="date" name="tanggal" id="b-tanggal" required class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Jam Mulai</label>
                            <input type="time" name="jam_mulai" id="b-jam-mulai" required class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Jam Selesai</label>
                            <input type="time" name="jam_selesai" id="b-jam-selesai" required class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-extrabold py-3 rounded-xl text-sm shadow-lg">
                        <i class="fas fa-credit-card mr-1"></i> Lanjut Ke Pembayaran
                    </button>
                </form>
            </div>

            <!-- RIWAYAT & PEMBAYARAN -->
            <div class="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-white"><i class="fas fa-history text-emerald-400 mr-2"></i> Riwayat & Status Pembayaran</h2>
                <div id="riwayat-area">
                    <div class="bg-slate-900/60 rounded-xl p-8 text-center text-slate-400 text-xs">Memuat riwayat...</div>
                </div>
            </div>
        </div>

    </main>

    <script src="/js/common.js"></script>
    <script src="/js/reservasi.js"></script>
</body>
</html>
